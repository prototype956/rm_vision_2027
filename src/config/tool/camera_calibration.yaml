schema_version: 1

board:
  columns: 11
  rows: 8
  square_size_mm: 25.0

# 内参 capture 仅保存原图；solve 逐张弹窗查看后解算。
# 外参 extrinsics-capture 复用 board/min_samples，并保存同帧 IMU 姿态及部署配置快照。
# extrinsics-solve 使用 S 接纳、X 排除、F 翻转编号，详见 docs/tool/CAMERA_CALIBRATION.md。
# 清晰度、倾斜比和棋盘投影面积倍率仅作为诊断记录，不设验收门限。
capture:
  min_samples: 20

# 以下 quality 门限仅用于内参；外参单独报告固定棋盘位姿一致性，不据此自动验收。
quality:
  max_rms_px: 0.5
  max_view_rms_px: 1.0

# 外参会话写入该根目录下的 extrinsics/，不与内参会话混用。
output_dir: artifacts/camera_calibration
